# Hopfentreff – Jekyll-Konfiguration (ohne So-Simple-Theme)
# Hinweis: Diese Datei wird beim Server-Start gelesen, nach Änderungen neu starten.

locale: de-DE
title: "Hopfentreff"
description: "Bier rein. Glücklich sein."
baseurl: # the subpath of your site, e.g. "/blog"
url: "https://hopfentreff.de"
logo: "/images/logo.png"
date_format: "%d.%m.%Y"

# Liquid
liquid:
  error_mode: strict

# Build settings
permalink: /:categories/:title/
markdown: kramdown
feed:
  path: atom.xml

# Exclude from processing.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Collections (URLs bleiben wie bisher: /hopfentreffen/<dateiname>/)
collections:
  hopfentreffen:
    output: true
    permalink: /:collection/:path/

# Front Matter Defaults
defaults:
  - scope:
      path: "_hopfentreffen"
      type: hopfentreffen
    values:
      layout: hopfentreff
